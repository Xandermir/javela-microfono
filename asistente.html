<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MARÍA - JAVELA CATÁLOGOS</title>
  <style>
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:#fff;
      background:linear-gradient(rgba(0,13,42,.18),rgba(0,13,42,.2)),url("fondo-javela.png") center/cover fixed;
      display:flex;justify-content:center;align-items:center;padding:22px
    }
    .pantalla{width:min(100%,820px);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 14px}
    .mensaje{color:#ffd878;font-family:Georgia,serif;font-size:clamp(25px,3vw,36px);margin:0 0 12px;text-shadow:0 0 15px rgba(255,190,50,.25)}
    .avatar{width:150px;max-width:42vw;height:auto;object-fit:contain;margin:0 auto 12px;filter:drop-shadow(0 0 20px rgba(0,120,255,.35))}
    .estado{margin:8px 0 14px;color:#e5f1ff;text-shadow:0 0 8px #006eff;line-height:1.5;min-height:24px}
    .conversacion{width:min(100%,720px);height:260px;overflow:auto;background:rgba(0,18,48,.78);border:1px solid rgba(217,173,72,.75);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left}
    .burbuja{max-width:88%;padding:11px 14px;border-radius:14px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
    .usuario{align-self:flex-end;background:#dce9f8;color:#173b68;border-bottom-right-radius:4px}
    .maria{align-self:flex-start;background:#17477f;color:white;border:1px solid rgba(255,215,120,.35);border-bottom-left-radius:4px}
    .controles{display:flex;gap:10px;width:min(100%,720px);margin-top:14px}
    button{border:1px solid #d9ad48;border-radius:12px;padding:14px 18px;font-size:15px;font-weight:bold;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    #hablar{flex:1;background:linear-gradient(135deg,#063b83,#001b49);color:white;box-shadow:0 0 15px rgba(0,115,255,.4)}
    .entrada{display:flex;gap:9px;width:min(100%,720px);margin-top:10px}
    input{flex:1;min-width:0;border:1px solid #d9ad48;border-radius:10px;padding:13px;font-size:15px;background:rgba(0,18,48,.88);color:#fff}
    input::placeholder{color:#c5d8ef}
    #enviar{background:#d9ad48;color:#172f4c}
    .pie{display:flex;justify-content:space-between;align-items:center;gap:12px;width:min(100%,720px);margin-top:12px;font-size:12px;color:#d8e6f8}
    #cerrar{padding:8px 11px;background:rgba(0,18,48,.8);color:#ffdc83;font-size:12px}
    @media(max-width:600px){body{padding:8px}.pantalla{padding:20px 8px}.avatar{width:125px}.conversacion{height:250px}.controles{flex-direction:column}.pie{align-items:flex-start}}
  </style>
</head>
<body>
  <main class="pantalla">
    <h1 class="mensaje">¿En qué puedo servirte o apoyarte hoy?</h1>
    <img src="maria.png" alt="MARÍA - Asistente de JAVELA CATÁLOGOS" class="avatar">
    <p class="estado" id="estado" role="status">Conectando con MARÍA...</p>

    <section id="conversacion" class="conversacion" aria-live="polite">
      <div class="burbuja maria">Hola, soy MARÍA. Puedes hablarme o escribirme y te responderé.</div>
    </section>

    <div class="controles">
      <button id="hablar" type="button" disabled>🎙 HABLAR CON MARÍA</button>
    </div>

    <form id="formulario" class="entrada">
      <input id="mensaje" type="text" maxlength="1500" placeholder="También puedes escribir aquí..." autocomplete="off" disabled>
      <button id="enviar" type="submit" disabled>Enviar</button>
    </form>

    <div class="pie">
      <span id="usuario">Acceso de prueba sin inicio de sesión</span>
      <button id="cerrar" type="button">Finalizar conversación</button>
    </div>
  </main>

<script>
  // La clave de OpenAI permanece en Google Apps Script. Nunca se incluye en GitHub.
  const API_URL = 'https://script.google.com/macros/s/AKfycbwiljbo-WU0WmXa_i0IwbzGrc1G4DOTWfP8cNe0iDRvOCP8P47yc8lS7-N-nIOZRl6C2g/exec';
  const estado = document.getElementById('estado');
  const hablar = document.getElementById('hablar');
  const enviar = document.getElementById('enviar');
  const mensaje = document.getElementById('mensaje');
  const conversacion = document.getElementById('conversacion');
  const formulario = document.getElementById('formulario');
  const cerrar = document.getElementById('cerrar');

  let tokenMaria = '';
  let previousResponseId = '';
  let contadorJsonp = 0;
  let reconocimientoActivo = null;

  function jsonp(parametros) {
    return new Promise((resolve, reject) => {
      const callback = 'mariaCallback_' + Date.now() + '_' + (++contadorJsonp);
      const script = document.createElement('script');
      const datos = new URLSearchParams({...parametros, callback});
      let terminado = false;
      const limpiar = () => {
        if (terminado) return;
        terminado = true;
        clearTimeout(temporizador);
        delete window[callback];
        script.remove();
      };
      window[callback] = respuesta => { limpiar(); resolve(respuesta); };
      script.onerror = () => { limpiar(); reject(new Error('No se pudo comunicar con el servidor de JAVELA.')); };
      const temporizador = setTimeout(() => { limpiar(); reject(new Error('El servidor tardó demasiado en responder. Inténtalo nuevamente.')); }, 45000);
      script.src = API_URL + '?' + datos.toString();
      document.head.appendChild(script);
    });
  }

  function mostrarEstado(texto) { estado.textContent = texto; }

  function agregarBurbuja(texto, tipo) {
    const div = document.createElement('div');
    div.className = 'burbuja ' + tipo;
    div.textContent = texto;
    conversacion.appendChild(div);
    conversacion.scrollTop = conversacion.scrollHeight;
  }

  function activarControles(activo) {
    hablar.disabled = !activo;
    mensaje.disabled = !activo;
    enviar.disabled = !activo;
  }

  function hablarRespuesta(texto) {
    if (!('speechSynthesis' in window)) {
      mostrarEstado('MARÍA respondió por escrito. Este navegador no tiene lectura de voz disponible.');
      return;
    }
    window.speechSynthesis.cancel();
    const voz = new SpeechSynthesisUtterance(texto);
    voz.lang = 'es-CO';
    voz.rate = 0.96;
    const voces = window.speechSynthesis.getVoices();
    voz.voice = voces.find(v => /^es-CO/i.test(v.lang)) || voces.find(v => /^es/i.test(v.lang)) || null;
    voz.onstart = () => mostrarEstado('MARÍA está respondiendo...');
    voz.onend = () => mostrarEstado('MARÍA está lista para escucharte.');
    window.speechSynthesis.speak(voz);
  }

  async function enviarAMaria(texto) {
    texto = String(texto || '').trim();
    if (!texto || !tokenMaria) return;
    agregarBurbuja(texto, 'usuario');
    mostrarEstado('MARÍA está pensando...');
    activarControles(false);
    try {
      const r = await jsonp({api:'chat', token:tokenMaria, message:texto, previousResponseId});
      if (!r || !r.ok) throw new Error((r && r.mensaje) || 'No se pudo obtener respuesta de MARÍA.');
      previousResponseId = r.responseId || previousResponseId;
      agregarBurbuja(r.texto, 'maria');
      hablarRespuesta(r.texto);
    } catch (e) {
      mostrarEstado(e.message || 'Ocurrió un error al comunicarse con MARÍA.');
    } finally {
      activarControles(!!tokenMaria);
    }
  }

  async function iniciarMaria() {
    try {
      const r = await jsonp({api:'auth'});
      if (!r || !r.ok || !r.token) throw new Error((r && r.mensaje) || 'No se pudo iniciar MARÍA.');
      tokenMaria = r.token;
      document.getElementById('usuario').textContent = 'Sesión temporal de prueba';
      activarControles(true);
      mostrarEstado('Conexión lista. Puedes hablar o escribirle a MARÍA.');
    } catch (e) {
      mostrarEstado(e.message || 'No se pudo conectar con el servidor de JAVELA.');
    }
  }

  hablar.addEventListener('click', () => {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      mostrarEstado('Este navegador no tiene reconocimiento de voz. Usa Chrome actualizado o escribe tu mensaje.');
      return;
    }
    if (reconocimientoActivo) { reconocimientoActivo.stop(); return; }
    const rec = new SpeechRecognition();
    reconocimientoActivo = rec;
    rec.lang = 'es-CO';
    rec.continuous = false;
    rec.interimResults = false;
    hablar.disabled = true;
    mostrarEstado('MARÍA te está escuchando...');
    rec.onresult = evento => {
      const texto = evento.results[0][0].transcript;
      reconocimientoActivo = null;
      enviarAMaria(texto);
    };
    rec.onerror = evento => {
      reconocimientoActivo = null;
      activarControles(!!tokenMaria);
      const errores = {
        'not-allowed':'Permite el acceso al micrófono en Chrome.',
        'no-speech':'No detecté voz. Inténtalo nuevamente.',
        'audio-capture':'No se encontró un micrófono.',
        'network':'El reconocimiento de voz perdió la conexión.'
      };
      mostrarEstado(errores[evento.error] || ('Error de micrófono: ' + evento.error));
    };
    rec.onend = () => {
      reconocimientoActivo = null;
      activarControles(!!tokenMaria);
    };
    try { rec.start(); }
    catch (e) {
      reconocimientoActivo = null;
      activarControles(!!tokenMaria);
      mostrarEstado('No se pudo iniciar el micrófono: ' + e.message);
    }
  });

  formulario.addEventListener('submit', e => {
    e.preventDefault();
    const texto = mensaje.value.trim();
    if (!texto) return;
    mensaje.value = '';
    enviarAMaria(texto);
  });

  cerrar.addEventListener('click', async () => {
    if (reconocimientoActivo) reconocimientoActivo.stop();
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    try { if (tokenMaria) await jsonp({api:'logout', token:tokenMaria}); } catch (e) {}
    tokenMaria = '';
    activarControles(false);
    mostrarEstado('Conversación finalizada. Puedes volver a entrar cuando quieras.');
  });

  iniciarMaria();
</script>
</body>
</html>
